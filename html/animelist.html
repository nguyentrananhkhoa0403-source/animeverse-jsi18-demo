<body>

	<header class="navbar">
		<div class="container-fluid px-5">
			<a href="../index.html" class="logo">AnimeVerse</a>

			<nav class="nav-menu">
				<a href="../index.html">Home</a>
				<a href="animelist.html">Anime</a>
				<a href="gallery.html">Gallery</a>
				<a href="about.html">About</a>
				<a href="news.html">News</a>
            	<button id="logoutBtn">Đăng xuất</button>
			</nav>
		</div>
	</header>

	<main class="anime-list">
		<div class="container">

			<div class="text-center mb-5">
				<h1>Anime List</h1>
				<p>Manage your favorite Anime</p>
			</div>

			<div class="anime-form">
				<h3 id="formTitle">Add Anime</h3>

				<form id="animeForm">
					<div class="row g-3">
						<div class="col-md-6">
							<label for="animeName">Anime Name</label>
							<input type="text" id="animeName" class="form-control" placeholder="Enter anime name">
						</div>

						<div class="col-md-6">
							<label for="animeGenre">Genre</label>
							<input type="text" id="animeGenre" class="form-control" placeholder="Enter genre">
						</div>

						<div class="col-md-6">
							<label for="animeYear">Release Year</label>
							<input type="number" id="animeYear" class="form-control" placeholder="Enter release year">
						</div>

						<div class="col-md-6">
							<label for="animeImage">Anime Image</label>
							<input type="file" id="animeImage" class="form-control" accept="image/*">
						</div>

						<div class="col-12">
							<label for="animeDescription">Description</label>
							<textarea id="animeDescription" class="form-control" rows="3" placeholder="Enter description"></textarea>
						</div>

						<div class="col-12">
							<button type="submit" class="btn btn-primary" id="submitBtn">
								<i class="fa-solid fa-plus"></i> Add Anime
							</button>

							<button type="button" class="btn btn-secondary d-none" id="cancelBtn">
								Cancel
							</button>
						</div>
					</div>
				</form>
			</div>

			<div class="anime-list-content">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h3>Anime Collection</h3>
					<input type="text" id="searchInput" class="form-control search-input" placeholder="Search anime...">
				</div>

				<div class="row g-4" id="animeList"></div>
			</div>

		</div>
	</main>

    <footer>
        <h2>AnimeVerse</h2>
        <p>Explore The Amazing World Of Anime</p>
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>
        </div>
        <p class="copyright">
            © 2026 AnimeVerse. All Rights Reserved.
        </p>
    </footer>
