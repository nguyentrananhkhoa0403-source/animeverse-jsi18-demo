<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AnimeVerse - Login</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="../css/login.css">
</head>

<body>



	<main class="login-page">
		<div class="login-container">
			<div class="login-content">

				<h1>Welcome Back</h1>

				<p class="login-subtitle">
					Login to continue exploring the world of AnimeVerse.
				</p>

				<form id="loginForm">

					<div class="form-group">
						<label for="email">Email</label>

						<div class="input-box">
							<i class="fa-solid fa-envelope"></i>

							<input
								type="email"
								id="email"
								name="email"
								placeholder="Enter your email"
								autocomplete="email"
								required
							>
						</div>

						<p class="error-message" id="emailError"></p>
					</div>

					<div class="form-group">
						<label for="password">Password</label>

						<div class="input-box">
							<i class="fa-solid fa-lock"></i>

							<input
								type="password"
								id="password"
								name="password"
								placeholder="Enter your password"
								autocomplete="current-password"
								required
							>
						</div>

						<p class="error-message" id="passwordError"></p>
					</div>

					<button type="submit" class="login-btn">
						Login
					</button>

				</form>

				<p class="register-text">
					Don't have an account?
					<a href="register.html">Register</a>
				</p>

			</div>
		</div>
	</main>

	<footer>
		<h2>AnimeVerse</h2>

		<p>Explore The Amazing World Of Anime</p>

		<div class="social-icons">
			<a href="#">
				<i class="fa-brands fa-facebook-f"></i>
			</a>

			<a href="#">
				<i class="fa-brands fa-instagram"></i>
			</a>

			<a href="#">
				<i class="fa-brands fa-youtube"></i>
			</a>

			<a href="#">
				<i class="fa-brands fa-github"></i>
			</a>
		</div>

		<p class="copyright">
			© 2026 AnimeVerse. All Rights Reserved.
		</p>
	</footer>

	<script type="module" src="../js/login.js"></script>
    <script>
(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="16kRWg5aQx0Wsu4Xy5dsD";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
</script>

</body>

</html>
