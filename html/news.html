<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AnimeVerse - News</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="manifest" href="../favicon/site.webmanifest">
	<link rel="stylesheet" href="../css/news.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2 class="logo">AnimeVerse</h2>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="anime.html">Anime</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>
</header>

	<main>

		<section class="news-hero">
			<div class="overlay"></div>

			<div class="news-hero-content">
				<p class="news-label">ANIMEVERSE NEWS</p>
				<h1>Anime News</h1>
				<p>Explore the latest news from the anime world.</p>
			</div>
		</section>

		<section class="news-section">

			<h2 class="section-title">Latest Anime News</h2>

			<div class="news-tools">
				<div class="search-box">
					<i class="fa-solid fa-magnifying-glass"></i>
					<input
						type="text"
						id="searchInput"
						placeholder="Search news..."
					>
				</div>

				<select id="categorySelect">
					<option value="all">All News</option>
					<option value="anime">Anime</option>
					<option value="movie">Movie</option>
					<option value="event">Event</option>
				</select>
			</div>

			<div class="news-grid" id="newsGrid"></div>

		</section>

	</main>

	<footer>

		<h2>AnimeVerse</h2>

		<p>Explore The Amazing World Of Anime</p>

		<div class="social-icons">
			<a href="#"><i class="fa-brands fa-facebook-f"></i></a>
			<a href="#"><i class="fa-brands fa-instagram"></i></a>
			<a href="#"><i class="fa-brands fa-youtube"></i></a>
			<a href="#"><i class="fa-brands fa-github"></i></a>
		</div>

		<p class="copyright">
			© 2026 AnimeVerse. All Rights Reserved.
		</p>

	</footer>

	<script src="../js/news.js"></script>

</body>

</html>
